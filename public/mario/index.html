<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-center;
      min-height: 100vh;
      cursor: pointer;
    }

    #screen {
      border: 4px solid #0f0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #0f0;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    .click-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0f0;
      font-family: monospace;
      font-size: 24px;
      text-align: center;
      animation: pulse 2s infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .hidden { display: none; }
  </style>
</head>
<body onclick="startGame()">
  <canvas id="screen" width="512" height="480"></canvas>
  <div id="clickPrompt" class="click-prompt">CLICK TO START</div>
  <div class="overlay">
    Controls: Arrow Keys = Move | Space = Jump | ESC = Exit
  </div>

  <script type="module">
    // Load the game module
    await import('./js/main.js');

    // Hide the prompt and let the user click
    window.startGame = function() {
      document.getElementById('clickPrompt').classList.add('hidden');
      // The click will trigger the game's own click listener
    };

    // Handle ESC key to notify parent window
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        window.parent.postMessage({ type: 'mario-exit' }, '*');
      }
    });
  </script>
</body>
</html>
