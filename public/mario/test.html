<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mario Test</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #log { white-space: pre-wrap; }
        #screen { border: 2px solid #0f0; }
    </style>
</head>
<body>
    <h2>Mario Game Test</h2>
    <div id="log"></div>
    <canvas id="screen" width="512" height="480"></canvas>

    <script type="module">
        const log = document.getElementById('log');
        function addLog(msg) {
            console.log(msg);
            log.textContent += msg + '\n';
        }

        addLog('Starting test...');

        window.addEventListener('error', (e) => {
            addLog(`ERROR: ${e.message} at ${e.filename}:${e.lineno}`);
        });

        try {
            addLog('Attempting to import main.js...');
            const main = await import('./js/main.js');
            addLog('main.js loaded successfully!');
            addLog('Module exports: ' + Object.keys(main).join(', '));
        } catch (err) {
            addLog(`FAILED to load main.js: ${err.message}`);
            addLog(`Stack: ${err.stack}`);
        }
    </script>
</body>
</html>
